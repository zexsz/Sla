<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado da Simulação</title>
    <style>
        .voltar {
            width: 200px;
            border-radius: 10%;
            height: 45px;
            position: absolute;
            top: 200px;
            left: 50px;
            color: white;
            background-color: #4CAF50;
        }
    
    </style>
</head>
<body>
    <h1>Resultado da simulação</h1>
    <p>Você precisa guardar aproximadamente:</p>
    <h2 id="resultado"></h2>
    <script>
    let valor = Number(localStorage.getItem("valorPorMes"));
    document.getElementById("resultado").textContent=
        valor.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        }) + " por mês";
    </script>
    <button class="voltar" onclick="window.location.href='pagina.html'">Voltar a página inicial</button>
</body>
</html>
